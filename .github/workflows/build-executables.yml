name: Build executables

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: firmador
            asset_name: firmador-linux
            gui_artifact_name: firmador-gui
            gui_asset_name: firmador-gui-linux
          - os: macos-latest
            artifact_name: firmador
            asset_name: firmador-macos
            gui_artifact_name: firmador-gui
            gui_asset_name: firmador-gui-macos
          - os: windows-latest
            artifact_name: firmador.exe
            asset_name: firmador.exe
            gui_artifact_name: firmador-gui.exe
            gui_asset_name: firmador-gui.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # El Python de actions/setup-python en Linux trae el módulo tkinter
      # pero necesita las librerías de Tcl/Tk del sistema para cargarlo.
      - name: Instalar Tcl/Tk (Linux, para la GUI)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Instalar dependencias
        run: |
          pip install -r requirements/requirements.txt
          pip install -r requirements/requirements-build.txt

      - name: Compilar ejecutable de consola
        run: pyinstaller --onefile --name firmador firmador.py

      - name: Compilar ejecutable con interfaz gráfica
        run: pyinstaller --onefile --windowed --name firmador-gui firmador_gui.py

      - name: Renombrar binarios para publicar
        shell: bash
        run: |
          if [ "${{ matrix.artifact_name }}" != "${{ matrix.asset_name }}" ]; then
            cp "dist/${{ matrix.artifact_name }}" "dist/${{ matrix.asset_name }}"
          fi
          if [ "${{ matrix.gui_artifact_name }}" != "${{ matrix.gui_asset_name }}" ]; then
            cp "dist/${{ matrix.gui_artifact_name }}" "dist/${{ matrix.gui_asset_name }}"
          fi

      - name: Subir como artifacts del workflow
        uses: actions/upload-artifact@v4
        with:
          name: ejecutables-${{ matrix.os }}
          path: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.gui_asset_name }}

      - name: Adjuntar a la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.gui_asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
